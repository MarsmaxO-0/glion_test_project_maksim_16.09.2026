{% load static %}
<div class="chat" id="site-chat" data-endpoint="{% url 'chat_api' %}" data-lang="{{ lang }}" data-thinking="{{ ui.chat.thinking }}">
  <button type="button" class="chat__fab" data-chat-toggle aria-expanded="false" aria-controls="chat-panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H9l-4.2 3.4c-.4.3-.8 0-.8-.4V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 8.5h8M8 11.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>{{ ui.chat.open }}</span>
  </button>
  <section class="chat__panel" id="chat-panel" hidden aria-label="{{ ui.chat.title }}">
    <header class="chat__head">
      <div>
        <div class="chat__title">{{ ui.chat.title }}</div>
        <div class="chat__subtitle">{{ ui.chat.subtitle }}</div>
      </div>
      <button type="button" class="chat__close" data-chat-toggle aria-label="{{ ui.chat.close }}">×</button>
    </header>
    <div class="chat__log" data-chat-log aria-live="polite">
      <div class="chat__msg chat__msg--bot">{{ ui.chat.hello }}</div>
      <div class="chat__chips" data-chat-chips>
        {% for q in ui.chat.suggestions %}<button type="button" class="chat__chip">{{ q }}</button>{% endfor %}
      </div>
    </div>
    <form class="chat__form" data-chat-form>
      {% csrf_token %}
      <textarea rows="1" maxlength="2000" placeholder="{{ ui.chat.placeholder }}" aria-label="{{ ui.chat.placeholder }}" required></textarea>
      <button type="submit" class="chat__send" aria-label="{{ ui.chat.send }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-7-8-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </section>
</div>
<script src="{% static 'js/chat.js' %}" defer></script>
