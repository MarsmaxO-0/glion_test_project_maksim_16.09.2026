{% extends 'base.html' %}
{% block title %}500{% endblock %}
{% block content %}
<section class="hero hero--compact">
  <div class="wrap">
    <div class="kicker kicker--light">500</div>
    <h1 class="hero__title">{{ ui.errors.server_error_title }}</h1>
    <p class="hero__lead">{{ ui.errors.server_error_text }}</p>
    <div class="hero__actions hero__actions--tight">
      <a href="/" class="btn btn--primary">{{ ui.errors.go_home }}</a>
      <a href="{{ phone_hrefs.0.1 }}" class="btn btn--ghost">{{ phone_hrefs.0.0 }}</a>
    </div>
  </div>
</section>
{% endblock %}
